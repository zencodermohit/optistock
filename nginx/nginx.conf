user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream api_backend {
        # 'api' is the docker-compose service name
        server api:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Let's Encrypt's HTTP-01 challenge, and it lives on port 80 because
        # the ACME spec says so -- the CA will not follow a redirect to 443 to
        # find it, which is what makes "just redirect everything to HTTPS" the
        # classic way to break your own certificate renewal ninety days after
        # everything started working.
        #
        # Served from a directory shared with certbot on the host, so renewal
        # never has to stop nginx. `certbot --standalone` binds port 80 itself
        # and therefore requires downtime every ninety days, forever.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            access_log off;
        }

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/app.conf;
    }

    # The HTTPS listener, if there is a certificate for it.
    #
    # A glob, and that is load-bearing: the entrypoint puts tls.conf here only
    # when an origin certificate exists, so on a server without one this matches
    # nothing and nginx starts on port 80 alone. Naming the file directly would
    # make a missing certificate a fatal config error and take the site down as
    # the price of trying to add HTTPS.
    include /etc/nginx/tls/*.conf;
}
