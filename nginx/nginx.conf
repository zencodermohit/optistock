user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream api_backend {
        # 'api' is the docker-compose service name
        server api:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Two endpoints hold a connection open for the life of a browser
            # tab: the live event stream and the assistant. The defaults close
            # both after 60s, which reads as "the stream keeps dying".
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            # Server-sent events must not be buffered. nginx buffers proxied
            # responses by default, so without this the browser receives
            # nothing until the buffer fills -- and on a live stream it never
            # does. The page then looks broken in production and fine locally,
            # which is the worst way to find out.
            proxy_buffering off;
            proxy_cache off;
            # SSE needs HTTP/1.1; the default 1.0 has no chunked encoding.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        location /ready {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            access_log off;
        }

        # The built React application. Baked into this image at build time by
        # nginx/Dockerfile -- previously this block returned 404 for everything,
        # so the entire frontend was unreachable in production while working
        # perfectly on the dev server.
        root /usr/share/nginx/html;
        index index.html;

        # Hashed filenames, so these can be cached hard and forever. A new
        # build produces new names; nothing has to be invalidated.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            # Client-side routing: /inventory and /alerts are React routes, not
            # files on disk. Without the fallback, a refresh on any page other
            # than "/" is a 404 -- the classic SPA deploy bug that never shows
            # up locally, because the dev server does this fallback for you.
            try_files $uri $uri/ /index.html;

            # index.html itself must never be cached. It names the hashed asset
            # bundles, so a stale copy points every returning visitor at files
            # the last deploy deleted.
            add_header Cache-Control "no-cache";
        }
    }
}
