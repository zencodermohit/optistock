# The HTTPS listener.
#
# NOT loaded unless an origin certificate is actually present. The entrypoint
# copies this into /etc/nginx/tls/ only when both files exist, and nginx.conf
# includes that directory with a glob -- so on a server with no certificate the
# glob matches nothing, nginx starts on port 80 alone, and the site stays up.
#
# That indirection is the whole point. A 443 server block referencing
# ssl_certificate files that do not exist is a fatal config error: nginx refuses
# to start at all, the container exits, and adding HTTPS takes the site down
# rather than upgrading it.
#
# THE CERTIFICATE IS A CLOUDFLARE ORIGIN CERTIFICATE, and that is a different
# animal from a Let's Encrypt one. It is trusted by Cloudflare and by nobody
# else -- a browser hitting this origin directly would reject it, loudly and
# correctly. That is fine, and slightly desirable: browsers talk to Cloudflare,
# Cloudflare talks to this. It is free, lasts fifteen years, and needs no
# renewal cron, no port-80 challenge, and nothing that can quietly expire at
# 3am on a bank holiday.
#
# It only means anything with the zone's SSL mode set to FULL (STRICT). On
# "Flexible" Cloudflare talks plain HTTP to this box and the padlock in the
# browser is a lie about the second half of the journey. On "Full" it uses TLS
# but does not verify the certificate, so it cannot tell this origin from an
# impostor. Strict is the one that checks.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # TLS 1.2 and 1.3 only. 1.0 and 1.1 are deprecated and nothing Cloudflare
    # sends will need them.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app.conf;
}
