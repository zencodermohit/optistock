# Everything a server block needs to serve OptiStock, in one file so that the
# HTTP and HTTPS listeners cannot drift apart.
#
# This is included from two places: the port 80 server in nginx.conf, and the
# port 443 server in tls.conf when an origin certificate is installed. Two
# copies of these blocks would be two copies to keep in step, and the failure
# mode of getting that wrong is a route that works on one scheme and 404s on
# the other -- which is exactly the kind of thing nobody tests.

# Security Headers.
#
# These are inherited by a location block if and only if that block declares NO
# add_header of its own -- one directive at the inner level replaces the whole
# set, it does not merge with it. Both `location /` and `location /assets/` set
# Cache-Control, so for a long time they silently dropped all four of these,
# and the HTML document -- the one thing X-Frame-Options actually protects --
# was served bare while the API responses that don't need it got the full set.
# Anywhere below that sets a header must therefore repeat these; the two that
# do are marked.
add_header X-Frame-Options "SAMEORIGIN";
add_header X-XSS-Protection "1; mode=block";
add_header X-Content-Type-Options "nosniff";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # $scheme is http on the port 80 server and https on the 443 one, so the
    # application is told the truth about how the request arrived either way.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Two endpoints hold a connection open for the life of a browser tab: the
    # live event stream and the assistant. The defaults close both after 60s,
    # which reads as "the stream keeps dying".
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Server-sent events must not be buffered. nginx buffers proxied responses
    # by default, so without this the browser receives nothing until the buffer
    # fills -- and on a live stream it never does. The page then looks broken in
    # production and fine locally, which is the worst way to find out.
    proxy_buffering off;
    proxy_cache off;
    # SSE needs HTTP/1.1; the default 1.0 has no chunked encoding.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

location /health {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    access_log off;
}

location /ready {
    proxy_pass http://api_backend;
    proxy_set_header Host $host;
    access_log off;
}

# Hashed filenames, so these can be cached hard and forever. A new build
# produces new names; nothing has to be invalidated.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Repeated, not inherited -- see the note at the top of this file.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
}

location / {
    # Client-side routing: /inventory and /alerts are React routes, not files on
    # disk. Without the fallback, a refresh on any page other than "/" is a 404
    # -- the classic SPA deploy bug that never shows up locally, because the dev
    # server does this fallback for you.
    try_files $uri $uri/ /index.html;

    # index.html itself must never be cached. It names the hashed asset bundles,
    # so a stale copy points every returning visitor at files the last deploy
    # deleted.
    add_header Cache-Control "no-cache";
    # Repeated, not inherited -- see the note at the top of this file. This is
    # the block that serves the HTML, so these matter most here.
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
