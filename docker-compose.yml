services:
  db:
    image: postgres:15-alpine
    container_name: optistock-db
    environment:
      POSTGRES_USER: optistock
      # Interpolated from .env at parse time. The ":?" form makes Compose abort
      # with this message if the variable is unset, so the database can never be
      # provisioned with a blank or forgotten password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: optistock_db
    ports:
      # Bound to loopback: reachable from the host for psql/pgAdmin, never from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - optistock_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optistock -d optistock_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - optistock-net

  redis:
    image: redis:7-alpine
    container_name: optistock-redis
    ports:
      # Loopback only. Redis runs without authentication by default, so an
      # internet-reachable Redis is a well-known remote-takeover vector. Only the
      # api container needs it, and it reaches it over the internal network.
      #
      # 6380 on the host, not 6379. A stock Redis install claims 6379 as an
      # auto-starting service, and then this container simply fails to bind --
      # but the worse failure is quieter: with both running, anything started
      # outside Docker on the default port talks to the OTHER Redis, so the
      # relay publishes into one broker while the consumers read from another
      # and events vanish with no error anywhere. An unusual port makes the two
      # impossible to confuse. Containers still talk to redis:6379 internally.
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - optistock-net

  api:
    build: .
    container_name: optistock-api
    ports:
      # Loopback only. Nginx reaches the API over the internal Docker network, so
      # this mapping exists purely for local debugging and /docs, and cannot be
      # used to bypass Nginx's rate limiting and security headers from off-host.
      - "127.0.0.1:8000:8000"
    # Deliberately no `environment:` block. Inline values take precedence over
    # env_file in Compose, so hardcoding DATABASE_URL here silently discarded the
    # deploy-injected production credentials. .env is now the single source.
    env_file:
      - .env
    environment:
      # The one service that migrates. Not in .env because .env is shared with
      # the relay and consumers, and they must NOT race the api on the same
      # upgrade. The note above about avoiding an environment block is about
      # DATABASE_URL specifically -- this key is not one .env owns.
      RUN_MIGRATIONS: "1"
    volumes:
      # The nightly ETL writes Parquet here. Without a volume this lives inside
      # the container, so every `docker compose down` — which deploy.yml runs on
      # each deploy — destroyed the entire analytical history the forecast needs.
      - optistock_data_lake:/app/data_lake
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - optistock-net

  relay:
    # Same image as the API, different entrypoint. The outbox relay is the only
    # thing that moves committed events into Redis, so without this service the
    # event system looks healthy -- rows accumulate in event_outbox, no errors
    # anywhere -- and nothing is ever delivered.
    build: .
    container_name: optistock-relay
    command: ["python", "-m", "app.workers.relay"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # It claims work with FOR UPDATE SKIP LOCKED, so a second replica is safe
    # and takes a different batch rather than duplicating this one.
    restart: unless-stopped
    networks:
      - optistock-net

  consumers:
    # Reacts to events: raises alerts, resolves them when stock recovers.
    # Separate from the relay because they fail differently -- the relay is
    # plumbing that must never stop, consumers run business rules that change
    # often. Restarting one should not interrupt the other.
    build: .
    container_name: optistock-consumers
    command: ["python", "-m", "app.workers.consumers"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Scaling this is safe: members of a Redis consumer group split the stream
    # between them, so each event is still handled exactly once across replicas.
    restart: unless-stopped
    networks:
      - optistock-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: optistock-pgadmin
    # Only starts with `docker compose --profile dev up`. A plain
    # `docker compose up` (what deploy.yml runs) skips it entirely, so no
    # database console process exists on the production host.
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?PGADMIN_EMAIL must be set in .env}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}"
    ports:
      # Loopback only. pgAdmin is a database console; it must never be internet-facing.
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - optistock-net

  nginx:
    # Built rather than pulled: the image now contains the compiled React app
    # as well as the proxy config. Previously this served the config from a
    # bind mount and had no frontend at all, so every non-/api path was a 404.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: optistock_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The Cloudflare origin certificate, read-only, from the host.
      #
      # Bind-mounted rather than baked into the image for the obvious reason --
      # a private key in an image layer is a private key in every copy of that
      # image, forever, including ones pushed somewhere by accident.
      #
      # The directory is created empty by the deploy, so this mount always
      # succeeds. nginx's entrypoint checks whether anything is actually in it
      # and enables HTTPS only if so, which is what lets a server with no
      # certificate keep serving instead of failing to start.
      - ./nginx/certs:/etc/nginx/certs:ro
      # Where certbot writes its HTTP-01 challenge files and nginx reads them
      # from. Sharing a directory is what lets the certificate renew every
      # ninety days without stopping the web server; the alternative,
      # `certbot --standalone`, wants port 80 to itself and buys you a small
      # outage four times a year until you forget why.
      - ./nginx/certbot-webroot:/var/www/certbot:ro
    # No config bind mount. The config is baked in beside the build it belongs
    # to, so a host file can't silently override it with a version that predates
    # the frontend and returns 404 for the whole site.
    depends_on:
      - api
    networks:
      - optistock-net
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost. Inside this image localhost resolves to ::1
      # only, while nginx's `listen 80` binds IPv4 -- so the check could never
      # connect and the container sat permanently unhealthy while serving the
      # site perfectly. A healthcheck that always fails is worse than none:
      # anything gating on it waits forever.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  optistock_data:
  optistock_data_lake:

networks:
  optistock-net:
    driver: bridge
