<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OptiStock — flow, banded by time</title>
<style>
  /* ------------------------------------------------------------------
     The same system as slide-architecture.html, designed the other way
     round.

     That one is a TOPOLOGY map: here are the parts, grouped, numbered so
     you know what order to read them in. This one is a FLOW map: the
     horizontal axis is time, the bands are "who is waiting", and there
     are no numbers because a flow that needs numbering has not been laid
     out properly.

     The single fact this design exists to teach is the one the other
     cannot show: the scanner is answered in milliseconds BECAUSE
     everything else is deferred. Put synchronous work above a labelled
     line and everything deferred below it, and the reader gets that for
     free, without a sentence of explanation.

     Deploy is deliberately absent. How code ships is not how data moves,
     and mixing the two on one canvas is a category error that costs the
     reader a re-orientation halfway through.
     ------------------------------------------------------------------ */
  :root{
    --bg:#0b0f18; --panel:#151b28; --ink:#eef1f7; --muted:#a8b3c6; --faint:#79849a;
    --line:#2a3342; --band:#101725;
    --hot:#7d97ff;   --hot-w:#1b2444;
    --hw:#3fc79a;    --hw-w:#0e2c23;
    --store:#e0a35c; --store-w:#2f2410;
    --brain:#b49bff; --brain-w:#241a44;
    --alert:#f0837a; --alert-w:#31191a;
    --sans:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  body.light{
    --bg:#ffffff; --panel:#f7f8fb; --ink:#14181f; --muted:#4a5568; --faint:#7c8698;
    --line:#dfe3ea; --band:#f4f6fa;
    --hot:#2f5bd0;   --hot-w:#e9efff;
    --hw:#0e8a63;    --hw-w:#e3f6ef;
    --store:#a8620d; --store-w:#fdf1e0;
    --brain:#6f4bcc; --brain-w:#efeaff;
    --alert:#b4342b; --alert-w:#fdecea;
  }
  html,body{margin:0;padding:0;background:var(--bg)}
  #slide{width:1600px;height:900px;background:var(--bg)}
  svg{display:block;width:1600px;height:900px}
  svg text{font-family:var(--sans);fill:var(--ink)}
  .t    {font-size:30px;font-weight:700;letter-spacing:-.4px}
  .tsub {font-size:15px;fill:var(--muted)}
  .band {font-size:15px;font-weight:700;letter-spacing:.3px}
  .when {font-family:var(--mono);font-size:12px;fill:var(--faint)}
  .l    {font-size:16px;font-weight:600}
  .s    {font-size:12.5px;fill:var(--muted)}
  .f    {font-family:var(--mono);font-size:11.5px;fill:var(--faint)}
  .box  {fill:var(--panel);stroke:var(--line);stroke-width:1.6}
  /* The main artery is heavier than everything else, so the eye has one
     thing to follow instead of fifteen equal candidates. */
  .main {stroke:var(--hot);stroke-width:3.2;fill:none}
  .side {stroke:var(--faint);stroke-width:1.8;fill:none}
</style>
</head>
<body>
<div id="slide">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--hot)"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--faint)"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="var(--bg)"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="48" y="50" class="t">One scan, from trigger to alert</text>
  <text x="48" y="76" class="tsub">Left to right is time. The bands are who is waiting.</text>
  <line x1="48" y1="96" x2="1552" y2="96" stroke="var(--line)" stroke-width="1.5"/>

  <!-- ════════ BAND A · synchronous ════════ -->
  <rect x="48" y="112" width="1504" height="184" rx="12" fill="var(--band)"/>
  <text x="70" y="146" class="band">THE DEVICE IS WAITING</text>
  <text x="70" y="168" class="when">about 200 ms</text>
  <text x="70" y="196" class="s">everything here</text>
  <text x="70" y="215" class="s">must finish before</text>
  <text x="70" y="234" class="s">the scanner is</text>
  <text x="70" y="253" class="s">answered</text>

  <rect x="266" y="150" width="196" height="108" rx="11" fill="var(--hw-w)" stroke="var(--hw)" stroke-width="2"/>
  <text x="284" y="182" class="l">Scan</text>
  <text x="284" y="206" class="s">sku · warehouse</text>
  <text x="284" y="226" class="s">in|out · quantity</text>
  <text x="284" y="246" class="f">barcode · RFID · ESP32</text>

  <path d="M464 204 H 522" class="main" marker-end="url(#m)"/>
  <rect x="524" y="150" width="172" height="108" rx="11" class="box"/>
  <text x="542" y="182" class="l">Nginx</text>
  <text x="542" y="206" class="s">TLS terminated</text>
  <text x="542" y="226" class="s">rate limited</text>

  <path d="M698 204 H 756" class="main" marker-end="url(#m)"/>
  <rect x="758" y="150" width="186" height="108" rx="11" class="box"/>
  <text x="776" y="182" class="l">FastAPI</text>
  <text x="776" y="206" class="s">token → tenant</text>
  <text x="776" y="226" class="s">idempotency check</text>
  <text x="776" y="246" class="f">seen this scan before?</text>

  <path d="M946 204 H 1004" class="main" marker-end="url(#m)"/>
  <rect x="1006" y="140" width="330" height="128" rx="13" fill="none"
        stroke="var(--hot)" stroke-width="2.4" stroke-dasharray="7 5"/>
  <text x="1008" y="132" class="f" style="fill:var(--hot)">ONE TRANSACTION — BOTH, OR NEITHER</text>
  <rect x="1022" y="154" width="298" height="46" rx="8" fill="var(--store-w)" stroke="var(--store)" stroke-width="1.8"/>
  <text x="1040" y="183" class="l">stock level changes</text>
  <rect x="1022" y="210" width="298" height="46" rx="8" fill="var(--store-w)" stroke="var(--store)" stroke-width="1.8"/>
  <text x="1040" y="239" class="l">outbox row written</text>

  <path d="M1338 204 H 1396" class="main" marker-end="url(#m)"/>
  <rect x="1398" y="164" width="140" height="80" rx="11" fill="var(--hw-w)" stroke="var(--hw)" stroke-width="2"/>
  <text x="1416" y="196" class="l">200 OK</text>
  <text x="1416" y="220" class="s">device released</text>

  <!-- ── the line that is the whole point ── -->
  <line x1="48" y1="312" x2="1552" y2="312" stroke="var(--hot)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="48" y="334" class="s" style="fill:var(--hot);font-weight:600">
    Everything below this line happens after the scanner has already been answered. Nobody is waiting for any of it.
  </text>

  <!-- ════════ BAND B · asynchronous ════════ -->
  <rect x="48" y="356" width="1504" height="164" rx="12" fill="var(--band)"/>
  <text x="70" y="390" class="band">NOBODY IS WAITING</text>
  <text x="70" y="412" class="when">seconds later</text>
  <text x="70" y="440" class="s">a slow alert can</text>
  <text x="70" y="459" class="s">never slow down</text>
  <text x="70" y="478" class="s">a scan</text>

  <path d="M1171 270 V 292 H 364 V 384" class="main" marker-end="url(#m)"/>
  <text x="380" y="284" class="f" style="fill:var(--hot)">the outbox row is the handover</text>

  <rect x="266" y="386" width="196" height="96" rx="11" class="box"/>
  <text x="284" y="418" class="l">Relay</text>
  <text x="284" y="442" class="s">publish, THEN</text>
  <text x="284" y="462" class="s">mark published</text>

  <path d="M464 434 H 522" class="main" marker-end="url(#m)"/>
  <rect x="524" y="386" width="196" height="96" rx="11" fill="var(--store-w)" stroke="var(--store)" stroke-width="1.8"/>
  <text x="542" y="418" class="l">Redis Stream</text>
  <text x="542" y="442" class="s">durable queue</text>
  <text x="542" y="462" class="s">consumer group</text>

  <path d="M722 434 H 780" class="main" marker-end="url(#m)"/>
  <rect x="782" y="386" width="210" height="96" rx="11" class="box"/>
  <text x="800" y="418" class="l">Consumers</text>
  <text x="800" y="442" class="s">discard anything</text>
  <text x="800" y="462" class="s">seen before</text>

  <path d="M994 412 H 1052" class="main" marker-end="url(#m)"/>
  <rect x="1054" y="382" width="240" height="56" rx="10" fill="var(--alert-w)" stroke="var(--alert)" stroke-width="1.8"/>
  <text x="1072" y="408" class="l">Alert raised</text>
  <text x="1072" y="428" class="s">below reorder · out of stock</text>

  <path d="M994 456 H 1052" class="side" marker-end="url(#s)"/>
  <rect x="1054" y="446" width="240" height="56" rx="10" class="box"/>
  <text x="1072" y="472" class="l">Dashboards refresh</text>
  <text x="1072" y="492" class="s">read models updated</text>

  <path d="M1296 410 H 1352" class="side" marker-end="url(#s)"/>
  <rect x="1354" y="382" width="184" height="120" rx="11" fill="var(--hw-w)" stroke="var(--hw)" stroke-width="2"/>
  <text x="1372" y="414" class="l">A person sees</text>
  <text x="1372" y="438" class="s">it, on a screen,</text>
  <text x="1372" y="458" class="s">seconds after the</text>
  <text x="1372" y="478" class="s">carton moved</text>

  <!-- ════════ BAND C · nightly ════════ -->
  <rect x="48" y="546" width="1504" height="150" rx="12" fill="var(--band)"/>
  <text x="70" y="580" class="band">A DIFFERENT CLOCK</text>
  <text x="70" y="602" class="when">01:00, every night</text>
  <text x="70" y="630" class="s">turns history</text>
  <text x="70" y="649" class="s">into advice</text>

  <rect x="266" y="576" width="196" height="86" rx="11" fill="var(--store-w)" stroke="var(--store)" stroke-width="1.8"/>
  <text x="284" y="608" class="l">Sales history</text>
  <text x="284" y="632" class="s">four years of it</text>

  <path d="M464 619 H 522" class="side" marker-end="url(#s)"/>
  <rect x="524" y="576" width="196" height="86" rx="11" fill="var(--brain-w)" stroke="var(--brain)" stroke-width="1.8"/>
  <text x="542" y="608" class="l">ETL → Parquet</text>
  <text x="542" y="632" class="s">stored column-wise</text>

  <path d="M722 619 H 780" class="side" marker-end="url(#s)"/>
  <rect x="782" y="576" width="210" height="86" rx="11" fill="var(--brain-w)" stroke="var(--brain)" stroke-width="1.8"/>
  <text x="800" y="608" class="l">ABC + forecast</text>
  <text x="800" y="632" class="s">what matters, how fast</text>

  <path d="M994 619 H 1052" class="side" marker-end="url(#s)"/>
  <rect x="1054" y="576" width="240" height="86" rx="11" fill="var(--brain-w)" stroke="var(--brain)" stroke-width="1.8"/>
  <text x="1072" y="608" class="l">EOQ + reorder point</text>
  <text x="1072" y="632" class="s">how much, and when</text>

  <path d="M1296 619 H 1352" class="side" marker-end="url(#s)"/>
  <rect x="1354" y="576" width="184" height="86" rx="11" fill="var(--store-w)" stroke="var(--store)" stroke-width="1.8"/>
  <text x="1372" y="608" class="l">Back to the</text>
  <text x="1372" y="632" class="s">same ledger</text>

  <!-- ════════ BAND D · on demand ════════ -->
  <rect x="48" y="722" width="1504" height="136" rx="12" fill="var(--band)"/>
  <text x="70" y="752" class="band">WHENEVER</text>
  <text x="70" y="772" class="band">SOMEONE ASKS</text>
  <text x="70" y="794" class="when">on demand</text>
  <text x="70" y="822" class="s">reads the same</text>
  <text x="70" y="841" class="s">ledger, nine ways</text>

  <rect x="266" y="750" width="196" height="80" rx="11" class="box"/>
  <text x="284" y="782" class="l">"What runs</text>
  <text x="284" y="806" class="l">out first?"</text>

  <path d="M464 790 H 522" class="side" marker-end="url(#s)"/>
  <rect x="524" y="750" width="196" height="80" rx="11" fill="var(--brain-w)" stroke="var(--brain)" stroke-width="1.8"/>
  <text x="542" y="782" class="l">Gemini</text>
  <text x="542" y="806" class="s">9 tenant-bound tools</text>

  <path d="M722 790 H 780" class="side" marker-end="url(#s)"/>
  <rect x="782" y="750" width="210" height="80" rx="11" class="box"/>
  <text x="800" y="782" class="l">Output filter</text>
  <text x="800" y="806" class="s">checked before it shows</text>

  <path d="M994 790 H 1052" class="side" marker-end="url(#s)"/>
  <rect x="1054" y="750" width="240" height="80" rx="11" class="box"/>
  <text x="1072" y="782" class="l">Answer, streamed</text>
  <text x="1072" y="806" class="s">word by word</text>

  <path d="M622 750 V 702" class="side" stroke-dasharray="4 4" marker-end="url(#s)"/>
  <text x="636" y="716" class="f">reads the ledger, never writes it</text>
</svg>
</div>
</body>
</html>
