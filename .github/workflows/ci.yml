name: OptiStock

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets a deploy be re-run from the Actions tab without inventing a commit.
  # A pipeline you can only trigger by pushing is one you cannot retry after
  # fixing something that lives outside the repository -- a secret, a stuck
  # host, a runner that never picked the job up.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      # One formatter, not two. This previously installed black AND ruff and
      # checked formatting with black -- but ruff is used locally, and the two
      # disagree on enough edge cases that any file touched with `ruff format`
      # failed CI. Two tools competing for the same job is a build that breaks
      # on a schedule nobody controls. Ruff does both lint and format, so it
      # owns both here.
      # Pinned. Unpinned, CI installs whatever released most recently, and a
      # version that widens the default rule set turns a green build red with
      # hundreds of findings in code nobody touched. Bump this deliberately.
      - name: Install Ruff
        run: pip install ruff==0.15.22
      - name: Format check
        run: ruff format --check app tests
      - name: Lint
        run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: optistock
          POSTGRES_PASSWORD: optistock_password
          POSTGRES_DB: optistock_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run Tests
        env:
          # conftest.py creates this database and runs `alembic upgrade head`
          # against it itself, so no separate migration step is needed here.
          # It also FORCES DATABASE_URL to this value, so there is no way for the
          # suite to touch a non-test database.
          TEST_DATABASE_URL: "postgresql://optistock:optistock_password@localhost:5432/optistock_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'test_secret_fallback' }}
        run: |
          # The database credentials above are strictly for this isolated, ephemeral CI environment.
          pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build -t optistock-api .

  # Runs only after lint, the FULL test suite and the image build have passed.
  #
  # It used to live in a second workflow carrying its own copy of the test job,
  # and the copies had already drifted: different install lines, and only one
  # of them had a Redis service. Neither difference was breaking anything the
  # day it was found -- the async assistant suites run under anyio's plugin,
  # which comes in via requirements.txt, so the missing pytest-asyncio was
  # never load-bearing -- but a duplicated job that nobody diffs is a fault
  # waiting for a reason, and the deploy gate is the worst place to keep one.
  # One pipeline cannot drift from itself, and it also halves the Actions
  # minutes a private repository is billed for.
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    # Never from a pull request, which would deploy unreviewed code, and never
    # from a branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3

      # Skip rather than fail when there is nowhere to deploy yet. Without this
      # the job dies inside the SSH action with "missing server host", which is
      # a red build on every push that says nothing about the cause. It starts
      # deploying on its own the moment EC2_HOST exists.
      - name: Check a deploy target is configured
        id: preflight
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EC2_HOST is not set, so there is no server to deploy to. Provision the instance (terraform/) and add the EC2_HOST, EC2_SSH_KEY and PUBLIC_ORIGIN secrets to enable deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to EC2
        if: steps.preflight.outputs.configured == 'true'
        # Pinned to a release, not @master. This action is handed the SSH
        # private key for the production host, so a floating ref means any
        # future commit on that branch runs with that key in scope.
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Abort on the first failing command.
            #
            # Without this the script runs on regardless, and the failure that
            # exposed it was the worst possible shape: `git pull` refused to
            # overwrite two untracked files, the script carried on, rebuilt the
            # images from the OLD checkout, restarted the stack and exited zero.
            # The run went green. The server was serving code from four commits
            # earlier and nothing anywhere said so.
            #
            # A deploy that cannot fail is not a deploy, it is a restart.
            set -euo pipefail

            cd /home/ubuntu/project_IV

            # Refuse to build from a checkout that is not what was just pushed.
            # `git pull` alone can fail for reasons that leave the tree usable
            # -- untracked collisions, local edits -- and every one of them ends
            # with the wrong code deployed under a green tick.
            git pull origin main
            echo "Deploying $(git rev-parse --short HEAD)"

            # Record what shipped, so rollback.sh knows what "previous" means.
            # The previous DEPLOYED commit is not the previous commit in the
            # log: several commits ship in one deploy, and the one before HEAD
            # may never have run anywhere. Written before the build, so a
            # deploy that fails halfway still leaves a trace of what it tried.
            echo "$(date -u +%FT%TZ) $(git rev-parse --short HEAD)" >> .deploy-history
            tail -50 .deploy-history > .deploy-history.tmp && mv .deploy-history.tmp .deploy-history
            
            # Inject production secrets. POSTGRES_PASSWORD provisions the database
            # container and MUST match the password embedded in DATABASE_URL, so
            # both are derived from the same secret.
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
            echo "DATABASE_URL=postgresql://optistock:${{ secrets.DB_PASSWORD }}@db:5432/optistock_db" >> .env
            echo "REDIS_URL=redis://redis:6379/0" >> .env
            # Rate-limit counters in Redis rather than in the process. In
            # memory they reset on every deploy -- handing whoever was being
            # throttled a fresh allowance -- and a second replica would get its
            # own set, silently doubling every limit. Database 1, so a flush of
            # the event stream on database 0 cannot clear the throttles.
            echo "RATE_LIMIT_STORAGE=redis://redis:6379/1" >> .env
            echo "SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}" >> .env
            echo "ALGORITHM=HS256" >> .env
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> .env
            # Same-origin in production: nginx serves the built frontend and
            # proxies /api on one host, so the browser never makes a
            # cross-origin request and CORS is not what lets the app work. This
            # stays narrow anyway, so a third-party page cannot call the API
            # with a user's credentials. PUBLIC_ORIGIN is the deployed URL
            # (e.g. http://<elastic-ip> before a domain exists).
            echo "ALLOWED_ORIGINS=[\"${{ secrets.PUBLIC_ORIGIN }}\"]" >> .env
            # Just the hostname, scheme and any trailing slash stripped. nginx
            # matches a Host header, which never contains either.
            #
            # Left EMPTY when that turns out to be a bare IP address, which
            # disables the HTTP->HTTPS redirect. A public certificate cannot be
            # issued for an IP, so redirecting http://<ip> to https://<ip>
            # sends every visitor to a certificate that names something else
            # and warns them off the site. No redirect is the correct
            # behaviour until a hostname exists; nginx treats empty as "do not
            # redirect" by design.
            PUBLIC_HOST=$(echo "${{ secrets.PUBLIC_ORIGIN }}" | sed -E 's#^[a-z]+://##; s#/.*$##')
            if echo "${PUBLIC_HOST}" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
              echo "PUBLIC_ORIGIN is a bare IP; HTTP->HTTPS redirect stays off until it names a host"
              PUBLIC_HOST=""
            fi
            echo "PUBLIC_HOST=${PUBLIC_HOST}" >> .env
            # Optional. Absent or empty, the Assistant screen says it is not
            # configured and the rest of the application is unaffected.
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
            # Fallback models, in order. The free tier's daily cap is per
            # PROJECT PER MODEL, so a chain multiplies the day's allowance --
            # four models is four separate allowances rather than one shared
            # one. Every model here was checked against the real API for tool
            # calling and streaming before being listed. 3.7-flash is last on
            # purpose: it works, and it was the slowest of the five by an order
            # of magnitude, so it is a last resort rather than a second choice.
            echo "ASSISTANT_FALLBACK_MODELS=gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.7-flash" >> .env
            # pgAdmin is gated behind the "dev" Compose profile and will not start
            # here, but Compose interpolates the whole file, so these must exist.
            echo "PGADMIN_EMAIL=disabled@example.com" >> .env
            echo "PGADMIN_PASSWORD=${{ secrets.PROD_SECRET_KEY }}" >> .env

            # Validate interpolation BEFORE touching running containers. Compose
            # now aborts on a missing secret, and we would rather fail here with
            # the old version still serving than fail after `down`.
            docker compose config -q

            # Fail fast on a box too small to build, rather than 20 minutes
            # later with an OOM-killed compiler and no obvious cause.
            #
            # The build compiles the React app (node + vite) and installs the
            # Python scientific stack (pandas, numpy, pyarrow) in the same run.
            # A 1 GB free-tier t2.micro with no swap cannot do it: the kernel
            # kills the process and Docker reports a generic non-zero exit,
            # which looks like a code failure and is not one.
            TOTAL_MB=$(free -m | awk '/^Mem:/{print $2}')
            SWAP_MB=$(free -m | awk '/^Swap:/{print $2}')
            echo "Host memory: ${TOTAL_MB}MB RAM, ${SWAP_MB}MB swap"
            if [ "$((TOTAL_MB + SWAP_MB))" -lt 2000 ]; then
              echo "::error::Need ~2GB of RAM+swap to build; this host has $((TOTAL_MB + SWAP_MB))MB."
              echo "Either use a larger instance, or add swap once:"
              echo "  sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile"
              echo "  sudo mkswap /swapfile && sudo swapon /swapfile"
              echo "  echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab"
              exit 1
            fi

            # Migrations run inside the api container's entrypoint, gated on
            # RUN_MIGRATIONS, which only that service sets -- so the schema is
            # upgraded exactly once per deploy and the relay and consumers do
            # not race it. A failed migration exits the api container, which
            # the check below turns into a failed deploy.
            # Build BEFORE stopping anything. The nginx image compiles the React
            # app (`npm run build` is `tsc -b && vite build`), so a type error
            # fails the build -- and when `down` ran first, that left the host
            # with nothing serving and no way back except a manual checkout.
            # Building first means a failed build is a no-op: the previous
            # containers are still up and still serving the old version.
            docker compose build
            docker compose down
            docker compose up -d

            # Fail the deploy if anything is already dead. Without this the step
            # is green whenever `up -d` returned, even when the API or the event
            # consumers crashlooped on their first tick.
            sleep 15
            docker compose ps
            if [ -n "$(docker compose ps --status exited --quiet)" ]; then
              echo "::error::A container exited immediately after deploy"
              docker compose ps --status exited
              docker compose logs --tail 50
              exit 1
            fi

            # Reclaim the build cache, AFTER the deploy is known good.
            #
            # Every build leaves layers behind and nothing was ever removing
            # them. On a 20GB disk that reached 72% -- of which 5.7GB was
            # cache -- and the remaining headroom was smaller than the pile
            # still growing. A full disk stops Postgres accepting writes, so
            # the failure would have arrived as the whole site going down
            # rather than as a deploy failing.
            #
            # Last, so a prune can never be the reason a deploy fails, and
            # -af rather than a filter because the cache is pure derived data:
            # the cost of dropping it is one slower build.
            echo "Disk before prune:"; df -h / | tail -1
            docker builder prune -af >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "Disk after prune:"; df -h / | tail -1
