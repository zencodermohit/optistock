<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OptiStock">
  <!--
    The same cube the sign-in page signs itself with, drawn to survive 16px.

    On its own tile rather than transparent: a tab strip is light in one theme
    and dark in the other, and a mark that relies on the ground behind it
    disappears in whichever one it was not drawn for. The navy tile is the
    product's own night ground, so the icon carries its context with it.

    Three faces, one hue at three lightnesses. That is what makes a cube read
    as a solid without an outline -- and at favicon size an outline would be
    most of the icon.
  -->
  <rect width="64" height="64" rx="14" fill="#111a31"/>

  <!-- Top face: catches the most light, and is the face that says "box". -->
  <path d="M32 12 51 23 32 34 13 23 32 12Z" fill="#7C93FF"/>
  <!-- Right face: the mid tone, read as the body of the solid. -->
  <path d="M51 23v18L32 52V34l19-11Z" fill="#3B4FE0"/>
  <!-- Left face: in shadow, so the two verticals separate at the near corner. -->
  <path d="M13 23v18l19 11V34L13 23Z" fill="#2A38B0"/>

  <!-- One specular edge along the top-left arris. Without it the mark goes
       flat at 16px, where the three face tones converge into one shape. -->
  <path d="M32 12 13 23" stroke="#A8B8FF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
</svg>
