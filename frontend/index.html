<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>OptiStock — Inventory Intelligence</title>
    <meta
      name="description"
      content="Multi-tenant inventory intelligence: live stock, demand forecasting and explainable reorder recommendations."
    />

    <!--
      The tab icon. A favicon.svg has been sitting in public/ since the project
      started with nothing linking to it, so every tab showed the browser's
      default globe -- and the file itself was a purple lightning bolt left
      over from a template, unrelated to this product.

      Three formats because browsers still disagree. The SVG is what modern
      Chrome and Firefox use and the only one that stays sharp on a high-DPI
      screen. The .ico carries 16/32/48/64 for Safari and for Windows, which
      also requests /favicon.ico by path whatever the markup says. The
      apple-touch-icon is what iOS uses when the site is saved to a home
      screen, where a 32px image would be upscaled into mush.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      /*
        Decide the theme before the first paint.

        This has to be inline and synchronous in <head>. The bundle loads after
        the browser has already painted the body, so resolving the theme in
        React means a white flash on every page load for anyone using dark --
        the one bug that makes a theme switcher feel broken rather than slow.

        Kept deliberately tiny and duplicated from src/lib/theme.tsx rather
        than imported, because anything importable arrives too late to be of
        any use here. The storage key and the two grounds are the whole of the
        shared knowledge; if they change there, change them here.
      */
      (function () {
        try {
          var saved = localStorage.getItem("optistock:theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a1020" : "#f5f7fb");
        } catch (e) {
          /* Private windows throw on localStorage. Light is a fine fallback. */
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
